<ion-header [translucent]="true">
  <ion-toolbar>


    <ion-grid style="text-align: center;">
      <ion-row>
        <ion-col id="1">
          <ion-buttons>
            <ion-menu-button color="dark"></ion-menu-button>
          </ion-buttons>
        </ion-col>
        <ion-col id="2">
          <ion-avatar>
            <img alt="Silhouette of a person's head" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
        </ion-col>
        <ion-col id="3">
          <ion-row>
            <div style="line-height: 3px; text-align: left; position: relative; right: 20px;">

              <p class="title-header">Name</p>
              <p class="title-name">Role/Designation</p>
            </div>
          </ion-row>
        </ion-col>
        <ion-col id="4">
          <div class="scan-qr">
            <!-- <ion-icon  color="primary" class="icon" name="alert-circle-outline"></ion-icon><br> -->
            <ion-icon color="primary" class="icon" name="scan-outline"></ion-icon><br>
            <!-- <ion-label color="primary">Support</ion-label> -->
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div id="container">
    <div class="Upper-part">
      <ion-item lines="full">
        <ion-grid [fixed]="true">
          <ion-row>
            <ion-col>
              <ion-select interface="popover" placeholder="2023">
                <div *ngFor="let date of years">
                  <ion-select-option value="{{date.year}}">{{date.year}}</ion-select-option>
                </div>
              </ion-select>
            </ion-col>
            <ion-col>
              <ion-select interface="popover" placeholder="month">
                <div *ngFor="let date of months">
                  {{date.month}}
                  <!-- <ion-select-option value="{{date}}">{{date.month}}</ion-select-option> -->
                </div>
              </ion-select>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>Date</ion-col>
            <ion-col>Breakfast</ion-col>
            <ion-col>Lunch</ion-col>
            <ion-col>Dinner</ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-icon name="calendar-outline"></ion-icon>
            </ion-col>
            <ion-col>
              0
            </ion-col>
            <ion-col>
              0
            </ion-col>
            <ion-col>
              0
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </div>
    <div class="Lower-part">
      <ion-grid [fixed]="true" *ngFor="let date of dates">
        <ion-row>
          <ion-col>{{date.id}} {{date.day}}</ion-col>
          <ion-col>
            <ion-checkbox (click)="openModal()"></ion-checkbox>
          </ion-col>
          <ion-col>
            <ion-checkbox (click)="openModal()"></ion-checkbox>
          </ion-col>
          <ion-col>
            <ion-checkbox (click)="openModal()"></ion-checkbox>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </div>

  <!-- <strong class="capitalize">{{ folder }}</strong> -->
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ topic.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="brand" *ngIf="isAbout">
    <img src="assets/icon/logo.png" alt="efacm logo" width="88" height="88" />
    <h2>efacm</h2>
  </div>
  <section class="card" *ngFor="let s of topic.sections">
    <h2 class="card-title">{{ s.h }}</h2>
    <p *ngFor="let para of s.p">{{ para }}</p>
  </section>
</ion-content>

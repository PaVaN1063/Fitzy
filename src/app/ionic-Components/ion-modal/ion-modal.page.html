<ion-content>
<div *ngFor="let user of data">
  <ion-grid  *ngIf="user.id === employeeID">
    <ion-row>
      <ion-col></ion-col>
      <ion-col >
            <ion-avatar>
             <img class="profile-img" alt="{{user.id}}" src="{{ user.image }}" />
            </ion-avatar>
      </ion-col>
      <ion-col>
        <ion-row>{{user.fname}}</ion-row>
        <ion-row>{{user.lname}}</ion-row>
        <ion-row>{{user.id}} | O</ion-row>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <div class="ion-text-center">
          <h6>QR scanned successfully on</h6>
        </div>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <div class="ion-text-center">
          <!-- <h3>25</h3>
         Mar 2023 [Saturday]
         <p >01:15:44 PM</p> -->
         <p>
           <!-- <ion-input [value]="dateTime" displayFormat="MMM DD, YYYY HH:mm" ></ion-input> -->
          </p>
<!-- <p>{{todayDate | date: "EEE dd MMM yyyy"}}</p> -->
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        
        <div class="ion-text-center">
       
          <ion-button id="Food-Button" [ngClass]="{breakfast:user.id =='01', lunch:user.id =='02', dinner:user.id =='03'}">Text</ion-button>
        </div>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <div class="ion-text-center">
          <!-- <ion-button id="button"  expand="block" (click)="cancel()">Click</ion-button>        -->
      </div>
    </ion-col>
    </ion-row>
  </ion-grid>
</div>
<!-- <div> -->
<div *ngFor="let user of data">
    <div *ngIf="user.id === employeeID"> <!-- replace '01' with the ID of the user you want to display -->
      <h2>{{ user.fullname }} {{ user.lname }}</h2>
      <!-- <img src="{{ user.image }}" alt="{{ user.fname }} {{ user.fname }}'s profile picture"> -->
    </div>
</div>
</ion-content>

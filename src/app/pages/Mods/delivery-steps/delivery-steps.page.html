<ion-header>
  <ion-toolbar>
    <ion-title style="text-align: center;">Status-Bars</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Card - 1 -->
  
  <ion-card >
    <div class="stepper-horizontal" id="stepper1">
      <div class="step editing">
          <div class="step-circle"><span>1</span></div>
          <div class="step-title">Step - 1</div>
          <div class="step-bar-left"></div>
          <div class="step-bar-right"></div>
      </div>
      <div class="step">
          <div class="step-circle"><span>2</span></div>
          <div class="step-title">Address</div>
          <div class="step-bar-left"></div>
          <div class="step-bar-right"></div>
      </div>
      <div class="step">
          <div class="step-circle"><span>3</span></div>
          <div class="step-title">Contacts</div>
          <div class="step-optional">Optional</div>
          <div class="step-bar-left"></div>
          <div class="step-bar-right"></div>
      </div>
      <!-- <div class="step">
          <div class="step-circle"><span>4</span></div>
          <div class="step-title">Reporting Info</div>
          <div class="step-optional">Optional</div>
          <div class="step-bar-left"></div>
          <div class="step-bar-right"></div>
      </div> -->
    </div>
    <ion-button size="default" style="margin-left: 200px;" (click)="nextStep()">Track</ion-button>
    </ion-card>


  <!-- Card - 2 -->

  <ion-card>
    <ion-list>
      <ion-item *ngFor="let status of statuses">
        <ion-label>{{status}}</ion-label>
        <ion-icon *ngIf="status === currentStatus" name="checkmark-circle" slot="end"
          [ngClass]="{'green-text-icon': status === currentStatus}"></ion-icon>
      </ion-item>
    </ion-list>

  </ion-card>

  <!-- Card - 3 -->

  <ion-card>
    <div class="flex-container">
      <div *ngFor="let status of statuses" class="flex-item">
        <ion-label [ngClass]="{'green-text': status === currentStatus}">{{status}}</ion-label>
      </div>
    </div>
  </ion-card>

  <!-- Card - 4 -->

  <ion-card>
    <ion-card>
      <div class="flex-container">
        <div *ngFor="let status of statuses" class="flex-item">
          <ion-label [ngClass]="{'green-text': status === currentStatus}">
            {{status}}
          </ion-label>
        </div>
      </div>
    </ion-card>
  </ion-card>


  <!-- Card - 5 -->

  <ion-card class="status-card">
    <div class="status-container">
      <div *ngFor="let status of statuses" class="status-item" [ngClass]="{'active': status === currentStatus}">
        {{status}}
      </div>
    </div>
  </ion-card>




</ion-content>

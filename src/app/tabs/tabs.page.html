<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="today">
      <ion-icon name="restaurant-outline"></ion-icon>
      <ion-label>Meals</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="water">
      <ion-icon name="water-outline"></ion-icon>
      <ion-label>Water</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="scan" class="scan-tab">
      <div class="scan-fab"><ion-icon name="scan-outline"></ion-icon></div>
      <ion-label>Scan</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="progress">
      <ion-icon name="trending-down-outline"></ion-icon>
      <ion-label>Progress</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="profile">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
